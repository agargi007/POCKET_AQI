<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AQI Intelligence Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<h1>🌍 AQI Intelligence Dashboard</h1>
<p class="subtitle">Predict Air Quality and Health Advisory</p>

<div class="inputBox">

<input id="cityInput" type="text" placeholder="Enter City (Delhi, Mumbai etc)">

<button id="predictBtn">Predict AQI</button>

</div>


<div class="dashboard">

<div class="card">

<h2>AQI</h2>

<div id="aqiValue">--</div>

<div id="aqiCategory">Waiting for input</div>

</div>


<div class="card">

<h2>Health Advisory</h2>

<p id="advisoryText">
Enter a city to see air quality advisory.
</p>

</div>

</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
